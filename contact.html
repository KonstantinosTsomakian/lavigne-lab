<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Lavigne Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <div class="container">
      <section class="page-head">
        <div>
          <h1>Contact</h1>
          <p>For enquiries about our research, collaborations or open positions, please contact us. The lab is based at IMBB-FORTH in Heraklion, Crete.</p>
        </div>
        <svg viewBox="0 0 170 170" aria-hidden="true">
          <circle cx="85" cy="85" r="78" fill="var(--sun-soft)"/>
          <circle cx="128" cy="44" r="16" fill="#d4a03a"/>
          <path d="M20 128q32-14 64 0t66 0" fill="none" stroke="#3f7fbf" stroke-width="6" stroke-linecap="round"/>
          <path d="M20 144q32-14 64 0t66 0" fill="none" stroke="#1f6f78" stroke-width="6" stroke-linecap="round"/>
          <path d="M80 110s-26-24-26-44a26 26 0 0 1 52 0c0 20-26 44-26 44z" fill="#c8553d"/>
          <circle cx="80" cy="66" r="10" fill="#fff"/>
        </svg>
      </section>
      <div class="contact-grid">
        <div class="card">
          <h3>Contact details</h3>
          <ul class="contact-list" id="contact-details"></ul>
          <a class="btn" href="https://www.imbb.forth.gr/en/contact/directions/" target="_blank" rel="noopener">Directions to IMBB</a>
        </div>
        <iframe class="map" title="Map of IMBB-FORTH, Heraklion"
          src="https://www.openstreetmap.org/export/embed.html?bbox=25.0600%2C35.2980%2C25.0820%2C35.3120&amp;layer=mapnik&amp;marker=35.3051%2C25.0717"
          loading="lazy"></iframe>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
